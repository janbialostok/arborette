openapi: 3.0.0
info:
  title: Time Series API
  version: 1.0.0
  description: API for managing time-series datasets and their versions

paths:
  /timeseries/{datasetId}/versions:
    get:
      summary: Get all versions of a time-series dataset
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of dataset versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeSeriesVersion'

    post:
      summary: Create a new version for a time-series dataset
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeSeriesVersionCreate'
      responses:
        '201':
          description: Version created successfully
        '400':
          description: Invalid input

  /timeseries/{datasetId}/compare:
    get:
      summary: Compare two versions of a time-series dataset
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: version1
          in: query
          required: true
          schema:
            type: integer
        - name: version2
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Comparison results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeSeriesComparison'

  /timeseries/{datasetId}/trends:
    get:
      summary: Get trend analysis for a time-series dataset
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Trend analysis results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeSeriesTrends'

components:
  schemas:
    TimeSeriesVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        datasetId:
          type: string
          format: uuid
        versionNumber:
          type: integer
        data:
          type: object
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - datasetId
        - versionNumber

    TimeSeriesVersionCreate:
      type: object
      properties:
        data:
          type: object
      required:
        - data

    TimeSeriesComparison:
      type: object
      properties:
        version1:
          $ref: '#/components/schemas/TimeSeriesVersion'
        version2:
          $ref: '#/components/schemas/TimeSeriesVersion'
        differences:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              oldValue:
                type: string
              newValue:
                type: string
              percentChange:
                type: number

    TimeSeriesTrends:
      type: object
      properties:
        datasetId:
          type: string
          format: uuid
        timeRange:
          type: object
          properties:
            startDate:
              type: string
              format: date
            endDate:
              type: string
              format: date
        trends:
          type: array
          items:
            type: object
            properties:
              metric:
                type: string
              direction:
                type: string
                enum: [up, down, stable]
              rateOfChange:
                type: number
              confidence:
                type: number