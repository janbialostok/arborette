openapi: 3.0.0
info:
  title: Insight API
  version: 1.0.0
  description: API for managing insights including time-series insights

paths:
  /insights:
    post:
      summary: Create a new insight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsightCreate'
      responses:
        '201':
          description: Insight created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Insight'
        '400':
          description: Invalid input

    get:
      summary: List insights
      parameters:
        - name: questionId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: isTimeSeries
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: List of insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Insight'

  /insights/{id}:
    get:
      summary: Get an insight by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Insight details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Insight'
        '404':
          description: Insight not found

    put:
      summary: Update an insight
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsightUpdate'
      responses:
        '200':
          description: Insight updated successfully
        '400':
          description: Invalid input
        '404':
          description: Insight not found

    delete:
      summary: Delete an insight
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Insight deleted successfully
        '404':
          description: Insight not found

  /insights/time-series:
    get:
      summary: Get time-series insights
      parameters:
        - name: datasetId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: List of time-series insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Insight'

components:
  schemas:
    Insight:
      type: object
      properties:
        id:
          type: string
          format: uuid
        questionId:
          type: string
          format: uuid
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        isTimeSeriesInsight:
          type: boolean
        timeSeriesContext:
          type: object
      required:
        - id
        - questionId
        - content

    InsightCreate:
      type: object
      properties:
        questionId:
          type: string
          format: uuid
        content:
          type: string
        isTimeSeriesInsight:
          type: boolean
          default: false
        timeSeriesContext:
          type: object
      required:
        - questionId
        - content

    InsightUpdate:
      type: object
      properties:
        content:
          type: string