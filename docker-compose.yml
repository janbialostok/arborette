# Local-dev stack: four infra services, a completion-gated init chain
# (db-bootstrap -> migrate), four long-running Go services (including the
# Sleep-Cycle Worker in serve mode, which the orchestrator's HTTP launcher drives),
# the Next.js web UI, and the sleepcycle one-shot job (profile "jobs", so `make up`
# skips it -- it exercises the AWS Batch seam). The init chain provisions runtime
# roles and applies migrations before any service authenticates; embedding-consuming
# services additionally wait for the model pull. See .env.example for the variables
# .env must supply.

# Hostnames point at compose service names; passwords/creds come from .env via
# env_file. environment wins over env_file, so these hostnames always apply.
x-app-environment: &app-environment
  NEO4J_URI: bolt://neo4j:7687
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  S3_ENDPOINT: http://minio:9000
  OLLAMA_URL: http://ollama:11434

services:
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    # cypher-shell's password is passed on the command line: the neo4j image maps
    # every NEO4J_-prefixed env var to a server config key, so NEO4J_USERNAME/
    # NEO4J_PASSWORD would fail strict config validation at boot. NEO4J_AUTH
    # already exposes the password in the container env, so this adds no exposure.
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p '${NEO4J_PASSWORD}' 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  postgres:
    # Pinned to a >= 0.8.0 tag: goal-scoped retrieval sets hnsw.iterative_scan,
    # which pgvector added in 0.8.0. ValidateVectorExtensionVersion fails startup
    # against an older extension.
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_OWNER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_OWNER_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio:
    # Pinned to a release that still bundles curl for the /minio/health/live
    # healthcheck; newer tags dropped curl from the image.
    image: minio/minio:RELEASE.2023-09-04T19-57-37Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # One-shot: pulls the embedding model to completion so no service starts
  # before its model is present.
  ollama-pull:
    image: ollama/ollama
    entrypoint: ["/bin/sh", "-c", "ollama pull ${OLLAMA_MODEL}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL}
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # Init chain step 1: provision runtime LOGIN roles (idempotent) before grants.
  db-bootstrap:
    build:
      context: .
      dockerfile: cmd/dbbootstrap/Dockerfile
    env_file: [.env]
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Init chain step 2: apply migrations (extension, tables, grants) as owner.
  migrate:
    build:
      context: .
      dockerfile: cmd/migrate/Dockerfile
    command: ["up"]
    env_file: [.env]
    environment:
      <<: *app-environment
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    restart: "no"

  orchestrator:
    build:
      context: .
      dockerfile: cmd/orchestrator/Dockerfile
    env_file: [.env]
    environment:
      <<: *app-environment
      # Selects the HTTP launcher so the Phase-2 trigger dispatches to the
      # sleepcycle-serve worker (full URL, /runs included). Set here, not in .env,
      # so it always applies: compose environment wins over env_file.
      SLEEPCYCLE_WORKER_URL: http://sleepcycle-serve:8084/runs
      # Selects the verifier HTTP launcher the same way (full URL, /verifications
      # included). Wired here for the verifier-dispatch path a later shell adds.
      VERIFIER_WORKER_URL: http://verifier-serve:8085/verifications
    ports:
      - "8080:8080"
    volumes:
      - ./local-import:/import:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      ollama-pull:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
      # The sandbox defines no healthcheck, so gate on start, not health.
      sandbox:
        condition: service_started

  sandbox:
    build:
      context: .
      dockerfile: cmd/sandbox/Dockerfile
    env_file: [.env]
    environment:
      <<: *app-environment
    ports:
      - "8081:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      # The sandbox hard-depends on Postgres for the data-source ref registry.
      postgres:
        condition: service_healthy

  # One-shot job, not a long-running service: the profile keeps `make up` from
  # starting it. This block exercises the AWS Batch seam -- the production path is
  # a scheduler invoking the same binary with -goal. Run it per goal with
  #   docker compose run --rm sleepcycle -goal <optimization_function_id>
  # The long-running serve alternative (`make up` starts it) is sleepcycle-serve.
  sleepcycle:
    profiles: ["jobs"]
    # Anchored so the serve variant below reuses the same image and wait-for graph:
    # a new startup dependency edited here applies to both, instead of silently
    # drifting between the two.
    build: &sleepcycle-build
      context: .
      dockerfile: cmd/sleepcycle/Dockerfile
    env_file: [.env]
    environment:
      <<: *app-environment
    depends_on: &sleepcycle-depends
      migrate:
        condition: service_completed_successfully
      ollama-pull:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
      sandbox:
        condition: service_started
      orchestrator:
        condition: service_started

  # The Sleep-Cycle Worker in serve mode: same image and wiring as the one-shot
  # sleepcycle job, but long-running (one cycle per POST /runs) so the orchestrator's
  # HTTP launcher can drive Phase 2. Un-profiled, so `make up` starts it.
  sleepcycle-serve:
    build: *sleepcycle-build
    command: ["-serve"]
    env_file: [.env]
    environment:
      <<: *app-environment
    ports:
      - "8084:8084"
    depends_on: *sleepcycle-depends

  # One-shot Verifier job (profile "jobs", so `make up` skips it): runs a single
  # causal discovery for a (goal, data-source) and exits, exercising the AWS Batch
  # seam. Run it with:
  #   docker compose run --rm verifier -goal <id> -datasource <ref>
  # The long-running serve alternative (`make up` starts it) is verifier-serve.
  verifier:
    profiles: ["jobs"]
    # Anchored so the serve variant below reuses the same image and wait-for graph.
    build: &verifier-build
      context: .
      dockerfile: cmd/verifier/Dockerfile
    env_file: [.env]
    environment:
      <<: *app-environment
    depends_on: &verifier-depends
      migrate:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
      sandbox:
        condition: service_started
      orchestrator:
        condition: service_started

  # The Verifier in serve mode: same image and wiring as the one-shot job, but
  # long-running (one discovery per POST /verifications) so the orchestrator's HTTP
  # launcher can drive it. Un-profiled, so `make up` starts it.
  verifier-serve:
    build: *verifier-build
    command: ["-serve"]
    env_file: [.env]
    environment:
      <<: *app-environment
    ports:
      - "8085:8085"
    depends_on: *verifier-depends

  mcpserver:
    build:
      context: .
      dockerfile: cmd/mcpserver/Dockerfile
    env_file: [.env]
    environment:
      <<: *app-environment
    ports:
      - "8082:8082"
    depends_on:
      migrate:
        condition: service_completed_successfully
      ollama-pull:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
      # The orchestrator (goal-submission proxy target) defines no healthcheck,
      # so gate on start, not health.
      orchestrator:
        condition: service_started

  web:
    # Self-contained build context: the web app lives entirely under ./web, so a
    # ./web context keeps the Dockerfile's COPY paths conventional. environment
    # pins ORCHESTRATOR_URL/PORT so a host-override in .env (e.g. localhost) never
    # leaks into the container.
    build:
      context: ./web
      dockerfile: Dockerfile
    env_file: [.env]
    environment:
      ORCHESTRATOR_URL: http://orchestrator:8080
      PORT: "8083"
    # Container always binds the fixed internal 8083 (pinned above); WEBUI_PORT
    # from .env chooses the published host port, defaulting to 8083.
    ports:
      - "${WEBUI_PORT:-8083}:8083"
    depends_on:
      # The orchestrator (the only service the web UI talks to) defines no
      # healthcheck, so gate on start, not health.
      orchestrator:
        condition: service_started

volumes:
  neo4j_data:
  postgres_data:
  minio_data:
  ollama_data:
